[project]
name = "casesupport"
version = "0.1.0"
description = "Case support tooling for immigration benefit adjudication: translation, transcription, and record organization. Produces no scores and no decisions."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
